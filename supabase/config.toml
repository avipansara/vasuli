# Supabase local / deploy config — https://supabase.com/docs/guides/functions/function-configuration
#
# App login now uses Supabase Auth email OTP. These functions are still invoked
# from app flows that may only have the anon API key, so they intentionally
# disable JWT verification at the Edge gateway.

[functions.send-invitation]
verify_jwt = false

# Same as send-invitation: app may invoke with anon key only.
[functions.send-push-notification]
verify_jwt = false
