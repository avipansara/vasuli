name: Production Build

on:
  push:
    tags:
      - 'v*'
  # Manual fallback: tag pushes occasionally fail to trigger (seen 2026-09-05
  # with v1.0.23, fired twice with no run). Run from the Actions tab instead.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Lint, Typecheck, and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run typecheck (Supabase functions)
        run: npm run typecheck:supabase

      - name: Run tests
        run: npm run test

  migrate-prod:
    name: Promote & Apply Prod Migrations
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (master)
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply pending migrations to Prod and promote
        run: node scripts/promote-migrations.cjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROD_PROJECT_ID: ${{ secrets.SUPABASE_PROD_PROJECT_ID }}

      - name: Commit and push promoted migrations to master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/ supabase/pending_migrations/ types/supabase.ts
          if git diff --cached --quiet; then
            echo "No schema migration changes to commit."
            exit 0
          fi
          git commit -m "chore(db): promote migrations for ${{ github.ref_name }} [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:master; then
              echo "Promoted migrations pushed to master."
              exit 0
            fi
            echo "Push rejected, rebasing onto latest master (attempt $attempt)..."
            git pull --rebase origin master || break
          done
          echo "Failed to push promoted migrations after retries." >&2
          exit 1

  build-android:
    name: Build & Submit Android Production
    needs: [validate, migrate-prod]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync app.json version from tag
        run: node scripts/sync-app-version-from-tag.cjs "${{ github.ref_name }}"

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Build and Submit Android
        run: eas build --platform android --profile production --non-interactive --auto-submit --no-wait
        env:
          APP_ENV: production

  build-ios:
    name: Build & Submit iOS Production
    needs: [validate, migrate-prod]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync app.json version from tag
        run: node scripts/sync-app-version-from-tag.cjs "${{ github.ref_name }}"

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Build and Submit iOS
        run: eas build --platform ios --profile production --non-interactive --auto-submit --no-wait
        env:
          APP_ENV: production
