name: iOS E2E smoke

on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'contexts/**'
      - 'hooks/**'
      - 'lib/**'
      - 'constants/**'
      - 'services/**'
      - 'utils/**'
      - 'types/**'
      - 'supabase/**'
      - 'e2e/**'
      - 'scripts/e2e-*.cjs'
      - 'ios/**'
      - 'app.json'
      - 'app.config.ts'
      - 'babel.config.js'
      - 'metro.config.js'
      - 'tsconfig.json'
      - '.detoxrc.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

# The smoke suite is a PR gate only for changes that can affect the native
# app or its E2E contract. Docs-only changes stay on the existing validation
# workflows. The shared development E2E account and
# simulator make serialization necessary across smoke and full workflows.
concurrency:
  group: vasuli-ios-e2e-development
  cancel-in-progress: false

jobs:
  smoke:
    name: Build once and run smoke suite
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26
    timeout-minutes: 30
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_TEST_ACCOUNT_EMAIL: ${{ secrets.E2E_TEST_ACCOUNT_EMAIL }}
      EXPO_PUBLIC_TEST_ACCOUNT_OTP: ${{ secrets.E2E_TEST_ACCOUNT_OTP }}
      E2E_MEASUREMENT_SCOPE: ci-smoke
      E2E_RUN_ID: ci-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_WORKER_ID: ci-worker-0
      NODE_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare CI artifact directory
        run: mkdir -p ci-artifacts

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Generate the iOS native project
        run: npx expo prebuild --platform ios --no-install

      - name: Select the runner Node binary
        run: echo "NODE_BINARY=$(command -v node)" >> "$GITHUB_ENV"

      - name: Record Xcode identity
        id: xcode
        shell: bash
        run: |
          xcodebuild -version | tee ci-artifacts/xcode-version.txt
          identity=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Cache CocoaPods inputs
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ios/Podfile.lock
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.xcode.outputs.identity }}-cocoapods-${{ hashFiles('package.json', 'package-lock.json', 'app.json', 'app.config.ts', 'babel.config.js', 'metro.config.js', '.detoxrc.js', 'ios/**') }}

      - name: Install native dependencies
        shell: bash
        run: |
          if [[ -f ios/Podfile.lock ]]; then
            pod install --project-directory=ios --deployment
          else
            pod install --project-directory=ios
          fi

      - name: Verify iPhone 17 Pro simulator
        run: |
          xcrun simctl list devices available | tee artifacts-simulators.txt
          if ! grep -Fq 'iPhone 17 Pro' artifacts-simulators.txt; then
            echo 'The pinned runner does not provide the simulator configured in .detoxrc.js.' >&2
            exit 1
          fi

      - name: Build the release app once
        shell: bash
        run: |
          build_start=$(node -e 'process.stdout.write(String(Date.now()))')
          set +e
          npm run e2e:build:ios 2>&1 | tee ci-artifacts/e2e-build.log
          build_status=${PIPESTATUS[0]}
          set -e
          build_end=$(node -e 'process.stdout.write(String(Date.now()))')
          node -e 'const [startedAt, finishedAt, status] = process.argv.slice(1); process.stdout.write(JSON.stringify({ startedAt, finishedAt, durationMs: Number(finishedAt) - Number(startedAt), status: Number(status) }, null, 2) + "\n");' "$build_start" "$build_end" "$build_status" > ci-artifacts/build-timing.json
          exit "$build_status"

      - name: Run the smoke suite without rebuilding
        shell: bash
        run: |
          mkdir -p ci-artifacts
          set -o pipefail
          npm run e2e:ios:smoke 2>&1 | tee ci-artifacts/e2e-smoke.log

      - name: Collect smoke timing JSON for upload
        if: always()
        shell: bash
        run: |
          timing_dir=.scratch/detox-e2e-performance/measurements/ci-smoke
          mkdir -p ci-artifacts/timing
          if [[ -d "$timing_dir" ]]; then
            find "$timing_dir" -type f -name '*.json' -exec cp {} ci-artifacts/timing/ \;
          fi

      - name: Upload smoke timing, logs, and Detox artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detox-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-artifacts/**
            artifacts/**
            ios/build/Logs/**
            artifacts-simulators.txt
          if-no-files-found: warn
          retention-days: 14
